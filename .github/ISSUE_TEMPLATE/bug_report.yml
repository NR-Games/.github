name: Bug report
description: Something works wrong in a game, app or library.
labels: [bug]
body:
  - type: input
    id: product
    attributes:
      label: Product and version
      placeholder: Nonoku 0.1.1
    validations:
      required: true
  - type: dropdown
    id: store
    attributes:
      label: Installed from
      options: [Google Play, Huawei AppGallery, RuStore, Built from source, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: checkboxes
    id: security
    attributes:
      label: Not a security issue
      options:
        - label: This is not a vulnerability (those go by email, see SECURITY.md)
          required: true
